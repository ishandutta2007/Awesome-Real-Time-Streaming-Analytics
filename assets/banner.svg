<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <!-- Stream Line Gradients -->
    <linearGradient id="stream1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="stream2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic Animated Background Elements (Kept behind the text foreground card) */
    .pulse-node { animation: pulse 3s infinite ease-in-out; }
    .flow-wave1 { stroke-dasharray: 12 8; animation: dash 20s linear infinite; }
    .flow-wave2 { stroke-dasharray: 8 12; animation: dash 14s linear infinite reverse; }
    .particle { animation: floatParticle 6s infinite ease-in-out; }
    
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-12px); opacity: 0.9; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" class="bg" rx="16"/>

  <!-- Dynamic Animated Waves & Stream Graph Lines (BACKGROUND LAYER) -->
  <g opacity="0.45">
    <path d="M-50,280 Q200,120 450,220 T900,150 T1250,240" fill="none" stroke="url(#stream1)" stroke-width="4" class="flow-wave1"/>
    <path d="M-50,140 Q250,290 550,160 T950,230 T1250,100" fill="none" stroke="url(#stream2)" stroke-width="3" class="flow-wave2"/>
    <path d="M-50,60 Q300,180 650,80 T1050,190 T1250,80" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" class="flow-wave1"/>
  </g>

  <!-- Dynamic Stream Data Nodes & Particles (BACKGROUND LAYER) -->
  <g opacity="0.7">
    <circle cx="180" cy="180" r="4" fill="#38bdf8" class="particle" style="animation-delay: 0s;"/>
    <circle cx="420" cy="110" r="5" fill="#818cf8" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="780" cy="250" r="4" fill="#34d399" class="particle" style="animation-delay: 0.8s;"/>
    <circle cx="1020" cy="140" r="6" fill="#c084fc" class="particle" style="animation-delay: 2.2s;"/>

    <circle cx="900" cy="150" r="8" fill="#38bdf8" fill-opacity="0.4" filter="url(#softGlow)"/>
    <circle cx="900" cy="150" r="4" fill="#38bdf8"/>
    
    <circle cx="450" cy="220" r="10" fill="#10b981" fill-opacity="0.3" filter="url(#softGlow)"/>
    <circle cx="450" cy="220" r="5" fill="#34d399"/>
  </g>

  <!-- FOREGROUND LAYER: Solid Glassmorphism Header Card ensuring 100% clarity for title & subtitle -->
  <g transform="translate(60, 45)">
    <!-- Container Box -->
    <rect width="1080" height="270" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Top Category Pill / Badge -->
    <g transform="translate(40, 36)">
      <rect width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="140" y="19" text-anchor="middle" class="badge-text">⚡ REAL-TIME DATA ARCHITECTURE</text>
    </g>

    <!-- Main Title (Guaranteed Foreground Visibility) -->
    <text x="40" y="115" class="title">Awesome Real-Time Streaming Analytics</text>

    <!-- Subtitle -->
    <text x="40" y="158" class="subtitle">Curated Ecosystem of SaaS Platforms, Open-Source Stream Processing &amp; Real-Time OLAP</text>

    <!-- Stat/Tag Highlights in Card Footer -->
    <g transform="translate(40, 200)">
      <rect width="160" height="34" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌊 Stream Engines</text>

      <rect x="175" width="160" height="34" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="190" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Streaming SQL</text>

      <rect x="350" width="160" height="34" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="365" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 Real-Time OLAP</text>

      <rect x="525" width="160" height="34" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="540" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔄 CDC &amp; Pipelines</text>
    </g>
  </g>
</svg>
